# 1. PE-2
/ip address add address=10.100.13.2/30 interface=ether2
/ip address add address=10.100.13.34/30 interface=ether3
/ip address add address=152.100.13.2/30 interface=ether4

/routing ospf interface add interface=ether2 area=0.0.0.0
/routing ospf interface add interface=ether3 area=0.0.0.0
/routing ospf network add network=10.100.13.0/30 area=0.0.0.0
/routing ospf network add network=10.100.13.32/30 area=0.0.0.0

/routing bgp instance set default as=77133 router-id=10.100.13.2
/routing bgp peer add name=peer-ce2 remote-address=152.100.13.1 remote-as=65100
/routing bgp peer add name=peer-pe3 remote-address=10.10.13.3 remote-as=77133

/mpls ldp interface add interface=ether2
/mpls ldp interface add interface=ether3

/interface vpls add name=vpls-pe2 remote-peer=10.100.13.34 vpls-id=13:100

# 2. PE-3
/ip address add address=10.100.13.6/30 interface=ether2
/ip address add address=10.100.13.33/30 interface=ether3
/ip address add address=152.100.13.6/30 interface=ether4

/routing ospf interface add interface=ether2 area=0.0.0.0
/routing ospf interface add interface=ether3 area=0.0.0.1  ← area mismatch!

/routing bgp instance set default as=77133 router-id=10.100.13.6
/routing bgp peer add name=peer-ce3 remote-address=152.100.13.5 remote-as=65100
/routing bgp peer add name=peer-pe2 remote-address=10.100.13.2 remote-as=77133
/routing bgp peer add name=peer-bogus remote-address=99.99.99.99 remote-as=99999

/mpls ldp interface add interface=ether2

/interface vpls add name=vpls-pe3 remote-peer=10.100.13.2 vpls-id=13:101  ← mismatch!

# 3. CE-2
/ip address add address=152.100.13.1/30 interface=ether1
/ip address add address=10.0.0.1/24 interface=lan1

/routing bgp instance set default as=65100 router-id=152.100.13.1
/routing bgp peer add name=peer-pe2 remote-address=152.100.13.2 remote-as=77133

# 4. CE-3
/ip address add address=152.100.13.5/30 interface=ether1
/ip address add address=10.0.1.1/24 interface=lan1

/routing bgp instance set default as=65100 router-id=152.100.13.5
/routing bgp peer add name=peer-pe3 remote-address=152.100.13.6 remote-as=77133

# 5. Host-A (Linux)
auto lo
iface lo inet loopback

auto eth0
iface eth0 inet static
    address 10.0.0.2
    netmask 24
    gateway 10.0.0.1
    dns-nameservers 8.8.8.8

auto eth1
iface eth1 inet static
    address 10.0.2.2
    netmask 28
